name: Build macOS .dmg

on:
  push:
    branches: [feat/tauri-desktop]
  workflow_dispatch:

jobs:
  build:
    name: Build ReconBot Desktop (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v2
        with:
          args: -- --release
        env:
          # Provide a dummy signing key for unsigned builds
          TAURI_SIGNING_KEY: dummy-key-for-ci

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ReconBot-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
